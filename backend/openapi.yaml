openapi: 3.1.0
info:
  title: Pivot API
  version: 0.1.0
  description: Private invitation-only football dashboard API.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      summary: Register using an invitation code
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Registration'}
      responses:
        '201': {description: Registered}
        '422': {$ref: '#/components/responses/Problem'}
  /auth/login:
    post:
      summary: Start an opaque cookie session
      responses:
        '200': {description: Signed in}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      summary: End the current session
      responses:
        '204': {description: Signed out}
  /auth/me:
    get:
      summary: Read the current user
      security: [{cookieSession: []}]
      responses:
        '200': {description: Current user}
  /profile:
    patch:
      summary: Update nickname and synchronized theme
      security: [{cookieSession: []}]
      responses: {'200': {description: Updated}}
    delete:
      summary: Permanently delete the current account
      security: [{cookieSession: []}]
      responses: {'204': {description: Deleted}}
  /admin/invitations:
    get:
      summary: List invitations
      security: [{cookieSession: []}]
      responses: {'200': {description: Invitation list}}
    post:
      summary: Create an invitation and return its code once
      security: [{cookieSession: []}]
      responses: {'201': {description: Created}}
components:
  securitySchemes:
    cookieSession: {type: apiKey, in: cookie, name: pivot_session}
  schemas:
    Registration:
      type: object
      required: [email, password, nickname, invitationCode]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 12}
        nickname: {type: string, minLength: 2, maxLength: 40}
        invitationCode: {type: string}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
