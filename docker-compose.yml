services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pivot
      POSTGRES_USER: pivot
      POSTGRES_PASSWORD: pivot
    ports:
      - "5432:5432"
    volumes:
      - pivot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pivot -d pivot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pivot-postgres:
