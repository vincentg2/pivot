services:
  - type: web
    name: pivot
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - {key: APP_ENV, value: production}
      - {key: DATABASE_URL, sync: false}
      - {key: MIGRATION_DATABASE_URL, sync: false}
      - {key: SESSION_SECURE, value: "true"}
      - {key: SESSION_TTL, value: 720h}
      - {key: LOGIN_RATE_LIMIT, value: "10"}
      - {key: SETUP_TOKEN, generateValue: true}
      - {key: FOOTBALL_DATA_API_KEY, sync: false}
      - {key: VITE_REMOTE_LOGOS_ENABLED, value: "true"}
      - {key: FOOTAO_ENABLED, value: "false"}
      - {key: FOOTAO_USER_AGENT, value: "Pivot/0.1 (+https://github.com/vincentg2/pivot)"}
      - {key: NEWS_USER_AGENT, value: "Pivot/0.1 (+https://github.com/vincentg2/pivot)"}
